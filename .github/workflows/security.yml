name: Security

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build scanner
        if: ${{ !cancelled() }}
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/skillforge" .
      - name: Scan repository history and current files
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/skillforge" scan . --output-directory "$RUNNER_TEMP/repository-scan"'
      - name: Save scan summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-scan-${{ github.sha }}
          path: ${{ runner.temp }}/repository-scan/summary.json
          if-no-files-found: error
          retention-days: 30
