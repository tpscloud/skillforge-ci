name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
  publish:
    needs: [ci, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Verify and publish tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/packages"
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            archive="skillforge_${RELEASE_TAG#v}_${platform}.tar.gz"
            test -s "$archive"
            shasum -a 256 -c "$archive.sha256"
          done
          shasum -a 256 ./*.tar.gz > checksums.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Skillforge $RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/CHANGELOG.md"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.gz checksums.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
